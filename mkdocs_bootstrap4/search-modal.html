<div class="modal" id="mkdocs_search_modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="mkdocs-search-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="mkdocs-search-modal-title">Search</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <p>
                    From here you can search these documents. Enter
                    your search terms below.
                </p>
                <form role="search" onsubmit="return false;">
                    <div class="form-group">
                        <input type="search" class="form-control" placeholder="Search..." id="mkdocs-search-query" title="Type search term here" aria-label="Search terms">
                    </div>
                </form>
                <div id="mkdocs-search-results" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
            </div>
        </div>
    </div>
</div>
